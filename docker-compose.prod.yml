services:
  seed-reflections:
    build: .
    restart: unless-stopped
    expose:
      - "8476"
    # Secrets (ADMIN_PASSWORD, SEED_REFLECTIONS_CREDENTIAL_MASTER_KEY, Google and Stripe values) come from .env,
    # which is never committed. The explicit settings below always win over anything in .env.
    env_file: .env
    environment:
      SEED_REFLECTIONS_TRUST_PROXY: "1"
      SEED_REFLECTIONS_MODE: hosted
      SEED_REFLECTIONS_HOST: 0.0.0.0
      SEED_REFLECTIONS_PORT: 8476
      SEED_REFLECTIONS_PUBLIC_ORIGIN: https://${SEED_REFLECTIONS_DOMAIN:?Set SEED_REFLECTIONS_DOMAIN}
      SEED_REFLECTIONS_DATA_DIR: /data
      SEED_REFLECTIONS_UPLOAD_JOBS_DIR: /data/uploads/jobs
      SEED_REFLECTIONS_MIGRATE_LEGACY: "0"
      SEED_REFLECTIONS_MAX_UPLOAD_BYTES: ${SEED_REFLECTIONS_MAX_UPLOAD_BYTES:-2147483648}
      SEED_REFLECTIONS_HOSTED_STORAGE_BYTES: ${SEED_REFLECTIONS_HOSTED_STORAGE_BYTES:-10737418240}
      SEED_REFLECTIONS_HOSTED_MAX_CONVERSATIONS: ${SEED_REFLECTIONS_HOSTED_MAX_CONVERSATIONS:-1000000}
      SEED_REFLECTIONS_HOSTED_MAX_ANALYSIS_JOBS: ${SEED_REFLECTIONS_HOSTED_MAX_ANALYSIS_JOBS:-10000}
      SEED_REFLECTIONS_AUTH_RATE_LIMIT: ${SEED_REFLECTIONS_AUTH_RATE_LIMIT:-10}
      SEED_REFLECTIONS_AUTH_RATE_WINDOW_SECONDS: ${SEED_REFLECTIONS_AUTH_RATE_WINDOW_SECONDS:-60}
      SEED_REFLECTIONS_BILLING_ENABLED: ${SEED_REFLECTIONS_BILLING_ENABLED:-0}
      SEED_REFLECTIONS_EXTERNAL_AI_ENABLED: ${SEED_REFLECTIONS_EXTERNAL_AI_ENABLED:-0}
      SEED_REFLECTIONS_TEAM_ENABLED: ${SEED_REFLECTIONS_TEAM_ENABLED:-0}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_MASTER: ${STRIPE_PRICE_MASTER:-}
    volumes:
      - seed-reflections-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8476/api/v2/health',timeout=3))['status']=='healthy'"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks: [private]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      seed-reflections:
        condition: service_healthy
    environment:
      SEED_REFLECTIONS_DOMAIN: ${SEED_REFLECTIONS_DOMAIN:?Set SEED_REFLECTIONS_DOMAIN}
      SEED_REFLECTIONS_PROXY_MAX_BODY: ${SEED_REFLECTIONS_PROXY_MAX_BODY:-2GB}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [private]

networks:
  private:

volumes:
  seed-reflections-data:
  caddy-data:
  caddy-config:
